# x1e drop-in, sourced after /etc/mkinitcpio.conf

# Needed to reach the NVMe root. autodetect only sees the modules of the
# running kernel, which is wrong when building from a chroot.
MODULES+=(nvme? phy-qcom-qmp-pcie? tcsrcc-x1e80100?)

# Keyboard in the initramfs (emergency shell, LUKS prompt)
MODULES+=(i2c-qcom-geni? i2c-hid-of?)

HOOKS+=(x1e-firmware)
