name: Check for kernel updates
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Check for new commit
        id: check
        run: |
          set -ex
          repo=https://github.com/aruhier/linux-slim7x-x1e

          # Newest custom/X.Y branch and its head commit
          read -r commit ref < <(git ls-remote --heads "$repo" 'custom/*' \
            | grep -E 'refs/heads/custom/[0-9]+\.[0-9]+$' | sort -k2 -V | tail -1)
          branch=${ref#refs/heads/}

          current_commit=$(grep '^_commit=' linux-x1e/PKGBUILD | cut -d= -f2)
          current_pkgver=$(grep '^pkgver=' linux-x1e/PKGBUILD | cut -d= -f2)
          current_pkgrel=$(grep '^pkgrel=' linux-x1e/PKGBUILD | cut -d= -f2)

          if [ "$commit" = "$current_commit" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Kernel version at that commit (7.4.0-rc1 -> 7.4.0rc1)
          makefile=$(curl -fsSL "https://raw.githubusercontent.com/aruhier/linux-slim7x-x1e/$commit/Makefile")
          v() { sed -n "s/^$1 = *//p" <<<"$makefile" | head -1; }
          extra=$(v EXTRAVERSION)
          pkgver="$(v VERSION).$(v PATCHLEVEL).$(v SUBLEVEL)${extra//-/}"

          # Same kernel version but new commits on the branch: bump pkgrel
          if [ "$pkgver" = "$current_pkgver" ]; then
            pkgrel=$((current_pkgrel + 1))
          else
            pkgrel=1
          fi

          {
            echo "needs_update=true"
            echo "branch=$branch"
            echo "commit=$commit"
            echo "pkgver=$pkgver"
            echo "pkgrel=$pkgrel"
          } >> "$GITHUB_OUTPUT"
      - name: Update PKGBUILD
        if: steps.check.outputs.needs_update == 'true'
        run: |
          set -ex
          cd linux-x1e
          sed -i "s|^_branch=.*|_branch=${{ steps.check.outputs.branch }}|" PKGBUILD
          sed -i "s/^_commit=.*/_commit=${{ steps.check.outputs.commit }}/" PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${{ steps.check.outputs.pkgver }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=${{ steps.check.outputs.pkgrel }}/" PKGBUILD
      - name: Commit and push
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add linux-x1e/PKGBUILD
          git commit -m "Update linux-x1e to ${{ steps.check.outputs.pkgver }}-${{ steps.check.outputs.pkgrel }} (${{ steps.check.outputs.branch }} @ ${{ steps.check.outputs.commit }})"
          git push
      - name: Trigger build
        if: steps.check.outputs.needs_update == 'true'
        run: gh workflow run manual.yml --ref ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
